[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factoriax"
version = "0.1.0"
description = "A JAX-based grid environment for RL research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jax[cuda13]>=0.9.1",
    "flax>=0.8.0",
    "numpy>=1.26.0",
    "optax>=0.2.0",
    "pygame>=2.5.0",
    "gymnax>=0.0.8",
    "imageio[ffmpeg]>=2.33.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.15.5",
]

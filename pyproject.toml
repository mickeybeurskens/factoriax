[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factoriax"
version = "0.1.0"
description = "A JAX-based grid environment for RL research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jax[cuda13]>=0.9.1",
    "flax>=0.8.0",
    "numpy>=1.26.0",
    "optax>=0.2.0",
    "pygame>=2.5.0",
    "gymnax>=0.0.8",
    "imageio[ffmpeg]>=2.33.0",
    "orjson>=3.11.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default to running the full suite through all failures so a single
# broken test doesn't mask the rest. Use ``make test-fast-fail`` (or
# ``pytest -x`` explicitly) to stop at the first failure when
# iterating on a known-broken test. The pre-commit hook continues to
# pass ``-x`` itself — the dev loop wants fast feedback.
addopts = "-q"
markers = [
    "slow: marks tests as slow (e.g. CPU JIT compilation)",
]

[tool.coverage.run]
# Coverage targets the core environment tree (factoriax/) only. The
# baselines/ training code, tests, scripts, and vendored craftax/ are
# excluded — they're either the measurement instrument, out-of-tree
# references, or ahead-of-time agent code whose churn shouldn't move
# the floor that gates the engine.
source = ["factoriax"]
omit = [
    "factoriax/__main__.py",
    "factoriax/*/__main__.py",
]

[tool.coverage.report]
# Floor re-measured at 64.43% over the fast suite once coverage was
# narrowed to the factoriax/ core (baselines/ dropped from scope, so
# its agent churn no longer dilutes the engine number). The pre-commit
# hook enforces this — a PR that drops coverage below it fails to
# commit. Raising the floor is a deliberate act: bump this number when
# adding tests, never lower it. The ratchet practice itself is the
# load-bearing part, not the absolute number.
fail_under = 64
show_missing = false
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tensor dimension variables (B, T, A, P, S, N, L) are uppercase by convention in ML code.
"factoriax/analysis/*.py" = ["N806"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[dependency-groups]
dev = [
    "kaleido>=1.2.0",
    "mypy>=1.19.1",
    "plotly>=6.6.0",
    "pytest>=9.0.2",
    "pytest-cov>=5.0.0",
    "ruff>=0.15.5",
    "tqdm>=4.67.3",
    "wandb>=0.25.1",
]

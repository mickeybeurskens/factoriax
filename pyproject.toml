[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factoriax"
version = "0.1.0"
description = "A JAX-based grid environment for RL research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jax[cuda13]>=0.9.1",
    "flax>=0.8.0",
    "numpy>=1.26.0",
    "optax>=0.2.0",
    "pygame>=2.5.0",
    "gymnax>=0.0.8",
    "imageio[ffmpeg]>=2.33.0",
    "orjson>=3.11.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
]
docs = [
    "distrax>=0.1.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
# Coverage targets the core environment tree (factoriax/) only.
source = ["factoriax"]
omit = [
    "factoriax/__main__.py",
    "factoriax/*/__main__.py",
]

[tool.coverage.report]
fail_under = 64
show_missing = false
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# D212 and D417 are off under the numpy convention; listed to turn them back on.
select = ["D", "D212", "D417", "E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"factoriax/analysis/*.py" = ["N806"]
"tests/*.py" = ["D"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[dependency-groups]
dev = [
    "jupyterlab>=4.6.0",
    "kaleido>=1.2.0",
    "mypy>=1.19.1",
    "nbstripout>=0.9.1",
    "plotly>=6.6.0",
    "pytest>=9.0.2",
    "pytest-cov>=5.0.0",
    "ruff>=0.15.5",
    "tqdm>=4.67.3",
    "wandb>=0.25.1",
]
docs = [
    "distrax>=0.1.9",
    "myst-nb>=1.4.0",
    "sphinx>=9.0.4",
    "sphinx-book-theme>=1.2.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.7.0",
]
